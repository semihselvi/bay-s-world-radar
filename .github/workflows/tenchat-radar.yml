name: TENCHAT COMMENT RADAR

on:
  workflow_dispatch:
  push:
    paths:
      - tenchat_radar.py
      - russian_social_review.py
      - .github/workflows/tenchat-radar.yml
  schedule:
    - cron: "37 4,8,12,16,20 * * *"

concurrency:
  group: tenchat-comment-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: TenChat comment buyer scan
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m py_compile tenchat_radar.py
          python tenchat_radar.py
