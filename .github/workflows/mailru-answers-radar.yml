name: MAIL.RU ANSWERS RADAR

on:
  workflow_dispatch:
  push:
    paths:
      - mailru_answers_radar.py
      - russian_social_review.py
      - .github/workflows/mailru-answers-radar.yml
  schedule:
    - cron: "7 5,9,13,17,21 * * *"

concurrency:
  group: mailru-answers-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mail.ru Answers buyer scan
        env:
          MAILRU_LOOKBACK_DAYS: "7"
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m py_compile mailru_answers_radar.py
          python mailru_answers_radar.py
