name: BAY-S RuTube Radar

on:
  workflow_dispatch:
  schedule:
    # Turkey time UTC+3. No Exa; best-effort public RuTube API.
    - cron: "42 5 * * *"        # 08:42 discover + 24h comment catch-up
    - cron: "42 11,17 * * *"    # 14:42 / 20:42 comment pulses

concurrency:
  group: bay-s-rutube-radar-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  rutube-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py north_cyprus_focus.py north_cyprus_hunter.py north_cyprus_recall.py north_cyprus_catcher.py north_cyprus_spam_guard.py rutube_radar.py rutube_radar_silent.py
      - name: Run RuTube Radar
        env:
          RUTUBE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'discover_scan' || (github.event.schedule == '42 5 * * *' && 'discover_scan' || 'scan') }}
          RUTUBE_QUERY_LIMIT: "4"
          RUTUBE_WATCHLIST_LIMIT: "100"
          RUTUBE_LOOKBACK_HOURS: ${{ github.event.schedule == '42 5 * * *' && '24' || '7' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import rutube_radar_silent
          try:
              rutube_radar_silent.run()
          except Exception as exc:
              # RuTube uses unofficial/best-effort endpoints. Losing this source must
              # not make the wider Radar look unhealthy or interrupt other lanes.
              print("RUTUBE_BEST_EFFORT_DEGRADED", repr(exc))
              try:
                  rutube_radar_silent.rutube_radar.main.notify_telegram(
                      "⚠️ BAY-S RUTUBE kaynağı bu tur kullanılamadı. Best-effort kaynak atlandı; diğer Radar'lar normal devam ediyor."
                  )
              except Exception:
                  pass
          PY
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token=os.getenv('TELEGRAM_BOT_TOKEN','').strip(); chat=os.getenv('TELEGRAM_CHAT_ID','').strip()
          run_url=f"{os.getenv('GITHUB_SERVER_URL','https://github.com')}/{os.getenv('GITHUB_REPOSITORY','')}/actions/runs/{os.getenv('GITHUB_RUN_ID','')}"
          if token and chat:
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage',json={'chat_id':chat,'text':f'⚠️ BAY-S RUTUBE RADAR infrastructure failure.\n{run_url}'},timeout=15)
          PY
