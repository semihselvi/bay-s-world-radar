name: BAY-S North Cyprus Source Scout

on:
  schedule:
    - cron: "47 5 * * 0"  # Sunday 08:47 Turkey time
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py config.py world_engine.py source_scout.py
      - name: Discover North Cyprus communities
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          WORLD_EXA_NUM_RESULTS: "15"
        run: python source_scout.py
