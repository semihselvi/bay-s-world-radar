name: Inspect Last World Radar Scan

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Firestore client
        run: pip install google-cloud-firestore google-auth

      - name: Inspect latest HOT/WARM leads
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          python - <<'PY'
          import os, json
          from google.cloud import firestore
          from google.oauth2 import service_account

          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON','').strip()
          if not raw:
              raise SystemExit('FIREBASE_SERVICE_ACCOUNT_JSON missing')

          info = json.loads(raw)
          creds = service_account.Credentials.from_service_account_info(info)
          db = firestore.Client(credentials=creds, project=info.get('project_id'))

          collection = 'bay_s_world_leads'
          docs = list(db.collection(collection).stream())
          leads = []
          for doc in docs:
              d = doc.to_dict() or {}
              if d.get('classification') in ('HOT','WARM'):
                  d['_id'] = doc.id
                  leads.append(d)

          leads.sort(key=lambda d: (
              d.get('scanned_at',''),
              d.get('intent_score',0),
              d.get('credibility_score',0),
              d.get('market_fit_score',0)
          ), reverse=True)

          print(f'WORLD_RADAR_LEADS_FOUND={len(leads)}')
          for i, d in enumerate(leads[:10], 1):
              print('\n===== LEAD', i, '=====')
              for key in [
                  'classification','source','source_bucket','source_domain','published','author',
                  'title','url','market','route_to','intent_score','credibility_score',
                  'market_fit_score','why','suggested_reply','text'
              ]:
                  value = d.get(key,'')
                  if isinstance(value, str) and len(value) > 2500:
                      value = value[:2500] + '...'
                  print(f'{key}: {value}')
          PY
