name: BAY-S Belgium Home Buyer Radar

"on":
  workflow_dispatch:
  schedule:
    - cron: "57 6,12,18 * * *"  # Turkey: 09:57 / 15:57 / 21:57

concurrency:
  group: bay-s-belgium-home-buyer-radar
  cancel-in-progress: false

jobs:
  belgium-home-buyer-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test local home buyer radar v2
        run: |
          python -m py_compile local_home_buyer_radar.py local_home_buyer_radar_v2.py local_home_buyer_radar_v2_precision.py test_local_home_buyer_radar.py test_local_home_buyer_radar_v2.py
          python -m unittest -v test_local_home_buyer_radar.py test_local_home_buyer_radar_v2.py
      - name: Run Belgium home buyer radar v2
        env:
          LOCAL_HOME_RADAR_PROFILE: belgium_home
          LOCAL_HOME_LOOKBACK_HOURS: "48"
          LOCAL_HOME_BING_QUERY_LIMIT: "12"
          LOCAL_HOME_SERPER_QUERY_LIMIT: "4"
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python local_home_buyer_radar_v2_precision.py
