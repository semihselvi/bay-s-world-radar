name: BAY-S North Cyprus Web Recovery

on:
  workflow_dispatch:
  schedule:
    # Sunday 08:55 Turkey time (UTC+3). Free indexed-web recovery; no Exa.
    - cron: "55 5 * * 0"

concurrency:
  group: bay-s-nc-web-recovery
  cancel-in-progress: false

jobs:
  web-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile main.py world_engine.py source_crawler_v2.py north_cyprus_open_web.py north_cyprus_open_web_plus.py north_cyprus_focus.py north_cyprus_language_expansion.py north_cyprus_hunter.py north_cyprus_recall.py north_cyprus_spam_guard.py north_cyprus_catcher.py north_cyprus_catcher_expanded.py north_cyprus_web_recovery.py
      - name: Run 90-day indexed-web recovery
        env:
          NC_WEB_RECOVERY_DAYS: "90"
          NC_OPEN_WEB_ENABLED: "1"
          NC_OPEN_WEB_MODE: "full"
          NC_REDDIT_RSS_FEED_LIMIT: "24"
          NC_BING_RSS_QUERY_LIMIT: "20"
          NC_DYNAMIC_COMMUNITY_LIMIT: "40"
          WORLD_TELEGRAM_NETWORK_CRAWL: "0"
          WORLD_TELEGRAM_DISCOVER_PUBLIC_GROUPS: "0"
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python north_cyprus_web_recovery.py
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token=os.getenv('TELEGRAM_BOT_TOKEN','').strip(); chat=os.getenv('TELEGRAM_CHAT_ID','').strip()
          if token and chat:
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage',json={'chat_id':chat,'text':'⚠️ BAY-S NC WEB RECOVERY failed. Other radars continue.'},timeout=15)
          PY
