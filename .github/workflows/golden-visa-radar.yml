name: BAY-S Golden Visa Radar

"on":
  workflow_dispatch:
  schedule:
    - cron: "2 7,13,19 * * *"  # Turkey: 10:02 / 16:02 / 22:02

concurrency:
  group: bay-s-golden-visa-radar
  cancel-in-progress: false

jobs:
  golden-visa-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test audience radar
        run: |
          python -m py_compile audience_radar.py test_audience_radar.py
          python -m unittest -v test_audience_radar.py
      - name: Run Golden Visa radar
        env:
          AUDIENCE_RADAR_PROFILE: golden_visa
          AUDIENCE_LOOKBACK_HOURS: "72"
          AUDIENCE_BING_QUERY_LIMIT: "10"
          AUDIENCE_SERPER_QUERY_LIMIT: "8"
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python audience_radar.py
