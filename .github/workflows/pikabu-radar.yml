name: PIKABU RADAR

on:
  workflow_dispatch:
  push:
    paths:
      - pikabu_radar.py
      - .github/workflows/pikabu-radar.yml
  schedule:
    - cron: "17 4,8,12,16,20 * * *"

concurrency:
  group: pikabu-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pikabu buyer scan
        env:
          PIKABU_LOOKBACK_DAYS: "30"
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m py_compile pikabu_radar.py
          python pikabu_radar.py
