name: BAY-S YouTube Radar

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "scan | discover_scan | deep_scan"
        required: false
        default: "scan"
  schedule:
    # Turkey time UTC+3
    - cron: "25 5 * * *"
    - cron: "25 7,9,11,13,15,17,19 * * *"
    - cron: "45 4 * * 0"

concurrency:
  group: bay-s-youtube-radar-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  youtube-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py youtube_radar.py youtube_comment_expansion.py youtube_radar_expanded.py
      - name: Check YouTube Radar secret
        id: keycheck
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_RADAR_DISABLED missing YOUTUBE_API_KEY"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "YOUTUBE_API_KEY=OK"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Run YouTube Radar
        if: steps.keycheck.outputs.enabled == 'true'
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          YOUTUBE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '25 5 * * *' && 'discover_scan') || (github.event.schedule == '45 4 * * 0' && 'deep_scan') || 'scan' }}
          YOUTUBE_DISCOVERY_QUERY_LIMIT: ${{ github.event.schedule == '45 4 * * 0' && '22' || '12' }}
          YOUTUBE_SEARCH_RESULTS: "15"
          YOUTUBE_DISCOVERY_DAYS: "14"
          YOUTUBE_WATCHLIST_LIMIT: "160"
          YOUTUBE_COMMENT_PAGES: ${{ github.event.schedule == '45 4 * * 0' && '3' || github.event.schedule == '25 5 * * *' && '2' || '1' }}
          YOUTUBE_FULL_REPLY_THREADS_PER_VIDEO: ${{ github.event.schedule == '45 4 * * 0' && '6' || github.event.schedule == '25 5 * * *' && '4' || '2' }}
          YOUTUBE_FULL_REPLY_PAGES: "2"
          YOUTUBE_SCAN_OLD_THREAD_REPLIES: "1"
          YOUTUBE_LOOKBACK_HOURS: ${{ github.event.schedule == '25 5 * * *' && '24' || github.event.schedule == '45 4 * * 0' && '72' || '3' }}
        run: python youtube_radar_expanded.py
      - name: Notify workflow failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token=os.getenv('TELEGRAM_BOT_TOKEN','').strip(); chat=os.getenv('TELEGRAM_CHAT_ID','').strip()
          if token and chat:
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage',json={'chat_id':chat,'text':'⚠️ BAY-S YOUTUBE RADAR failed. Check GitHub Actions.'},timeout=15)
          PY
