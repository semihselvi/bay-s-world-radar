name: BAY-S North Cyprus Lead Catcher

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/north-cyprus-catcher.yml"
      - "north_cyprus_catcher_quality.py"
      - "north_cyprus_catcher_buyers_only.py"
      - "north_cyprus_catcher_expanded.py"
      - "north_cyprus_intent_classifier.py"
      - "north_cyprus_source_performance.py"
      - "north_cyprus_query_performance.py"
      - "north_cyprus_open_web.py"
      - "north_cyprus_open_web_plus.py"
      - "telegram_global_search.py"
      - "telegram_known_public_groups.py"
      - "telegram_member_deep_search.py"
      - "telegram_channel_comments.py"
      - "telegram_network_crawler.py"
      - "telegram_session_pool.py"
      - "telegram_tgden_discovery.py"
      - "telegram_recommendation_discovery.py"
      - "telegram_candidate_validator.py"
      - "tgden_buyer_posts.py"
      - "reddit_archive_buyer.py"
  schedule:
    # Turkey time UTC+3. Broad free discovery, staggered from other radar lanes.
    - cron: "52 6 * * *"                  # 09:52: 24h catch-up + forums + public discovery + open web + source network crawl
    - cron: "52 9,12,15,18,20 * * *"     # 12:52/15:52/18:52/21:52/23:52 fresh pulses

concurrency:
  group: bay-s-nc-lead-catcher-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  nc-lead-catcher:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax and intent regression check
        run: |
          python -m py_compile main.py world_engine.py source_crawler_v2.py telegram_message_context.py telegram_global_search.py telegram_known_public_groups.py telegram_member_deep_search.py telegram_channel_comments.py telegram_network_crawler.py telegram_tgden_discovery.py telegram_recommendation_discovery.py telegram_candidate_validator.py tgden_buyer_posts.py reddit_archive_buyer.py north_cyprus_source_performance.py north_cyprus_query_performance.py north_cyprus_author_reputation.py north_cyprus_notification_dedupe.py north_cyprus_cross_group.py north_cyprus_open_web.py north_cyprus_open_web_plus.py north_cyprus_conversation.py north_cyprus_focus.py north_cyprus_language_expansion.py north_cyprus_farsi_expansion.py north_cyprus_hunter.py north_cyprus_recall.py north_cyprus_spam_guard.py north_cyprus_intent_classifier.py north_cyprus_publisher_classifier.py north_cyprus_semantic_dedupe.py north_cyprus_intent_routing.py north_cyprus_catcher.py north_cyprus_reply_context.py north_cyprus_catcher_expanded.py north_cyprus_catcher_buyers_only.py runtime_quality_guard.py runtime_quality_guard_batch.py north_cyprus_catcher_quality.py test_north_cyprus_catcher_buyers_only.py test_runtime_quality_guard.py test_runtime_quality_guard_batch.py
          python -m unittest -q test_north_cyprus_catcher_buyers_only.py
          python north_cyprus_intent_selftest.py
          python test_runtime_quality_guard.py
          python test_runtime_quality_guard_batch.py
      - name: Run North Cyprus buyer and tenant catcher
        timeout-minutes: 25
        env:
          WORLD_LOOKBACK_HOURS: ${{ github.event_name == 'workflow_dispatch' && '24' || (github.event.schedule == '52 6 * * *' && '24' || '4') }}
          WORLD_TELEGRAM_GLOBAL_QUERY_LIMIT: "24"
          WORLD_TELEGRAM_GLOBAL_RESULTS_PER_QUERY: "36"
          WORLD_TELEGRAM_DISCOVER_PUBLIC_GROUPS: ${{ github.event.schedule == '52 6 * * *' && '1' || '0' }}
          WORLD_TELEGRAM_PUBLIC_GROUP_LIMIT: "180"
          WORLD_TELEGRAM_PUBLIC_GROUP_MESSAGES: "90"
          WORLD_TELEGRAM_KNOWN_GROUP_LIMIT: ${{ github.event.schedule == '52 6 * * *' && '120' || '70' }}
          WORLD_TELEGRAM_DYNAMIC_GROUP_LIMIT: "500"
          WORLD_TELEGRAM_KNOWN_GROUP_MESSAGES: ${{ github.event.schedule == '52 6 * * *' && '120' || '70' }}
          WORLD_TELEGRAM_DEEP_MAX_DIALOGS: ${{ github.event.schedule == '52 6 * * *' && '36' || '28' }}
          WORLD_TELEGRAM_DEEP_QUERY_LIMIT: "8"
          WORLD_TELEGRAM_DEEP_RESULTS: "18"
          WORLD_TELEGRAM_COMMENT_CHANNEL_LIMIT: "20"
          WORLD_TELEGRAM_COMMENT_MESSAGES: ${{ github.event.schedule == '52 6 * * *' && '100' || '60' }}
          WORLD_TELEGRAM_NETWORK_CRAWL: ${{ github.event.schedule == '52 6 * * *' && '1' || '0' }}
          WORLD_TELEGRAM_NETWORK_DIALOGS: "100"
          WORLD_TELEGRAM_NETWORK_MESSAGES: "140"
          WORLD_TELEGRAM_NETWORK_DAYS: "14"
          WORLD_TELEGRAM_NETWORK_FRONTIER: "120"
          NC_TGDEN_ENABLED: "1"
          NC_TELEGRAM_RECOMMENDATIONS: ${{ github.event.schedule == '52 6 * * *' && '1' || '0' }}
          NC_TELEGRAM_RECOMMENDATION_SEEDS: "5"
          NC_TGDEN_QUERY_LIMIT: "20"
          NC_TGDEN_RESULTS_PER_QUERY: "25"
          NC_TGDEN_POSTS_ENABLED: "1"
          NC_TGDEN_POST_QUERY_LIMIT: "8"
          NC_TELEGRAM_CANDIDATE_VALIDATE: "1"
          NC_TELEGRAM_CANDIDATE_LIMIT: "30"
          NC_TELEGRAM_CANDIDATE_MESSAGES: "30"
          NC_STITCH_GAP_HOURS: "6"
          NC_SOURCE_LEARNING: "1"
          NC_QUERY_LEARNING: "1"
          NC_AUTHOR_REPUTATION: "1"
          NC_SAME_TEXT_DEDUPE_HOURS: "168"
          NC_PERSON_DEDUPE_HOURS: "720"
          NC_OPEN_WEB_ENABLED: "1"
          NC_OPEN_WEB_MODE: ${{ github.event.schedule == '52 6 * * *' && 'full' || 'pulse' }}
          NC_REDDIT_ARCHIVE_ENABLED: "1"
          NC_REDDIT_ARCHIVE_QUERY_LIMIT: "10"
          NC_REDDIT_ARCHIVE_SUBREDDIT_LIMIT: "7"
          NC_REDDIT_RSS_FEED_LIMIT: ${{ github.event.schedule == '52 6 * * *' && '14' || '6' }}
          NC_BING_RSS_QUERY_LIMIT: ${{ github.event.schedule == '52 6 * * *' && '20' || '7' }}
          NC_HIGH_INTENT_WEB_QUERY_LIMIT: ${{ github.event.schedule == '52 6 * * *' && '12' || '10' }}
          NC_FACEBOOK_GROUP_QUERY_LIMIT: ${{ github.event.schedule == '52 6 * * *' && '8' || '4' }}
          NC_DYNAMIC_COMMUNITY_LIMIT: "30"
          NC_CATCHER_FORUM: ${{ github.event.schedule == '52 6 * * *' && '1' || '0' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION_WORLD }}
          WORLD_TELEGRAM_MEMBER_CHATS: ${{ secrets.WORLD_TELEGRAM_MEMBER_CHATS }}
        run: python north_cyprus_catcher_quality.py
      - name: Notify catcher failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token=os.getenv('TELEGRAM_BOT_TOKEN','').strip(); chat=os.getenv('TELEGRAM_CHAT_ID','').strip()
          if token and chat:
              run=f"https://github.com/{os.getenv('GITHUB_REPOSITORY','')}/actions/runs/{os.getenv('GITHUB_RUN_ID','')}"
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage',json={'chat_id':chat,'text':f'⚠️ BAY-S NC LEAD CATCHER failed.\n{run}'},timeout=15)
          PY
