name: BAY-S North Cyprus Buyer Catcher

on:
  workflow_dispatch:
  schedule:
    # Turkey time UTC+3. Free Telegram search, staggered from other radar lanes.
    - cron: "52 6 * * *"             # 09:52 Turkey: 24h catch-up + forum + public group discovery
    - cron: "52 9,12,15,18 * * *"    # 12:52/15:52/18:52/21:52 Turkey: fresh pulses

concurrency:
  group: bay-s-nc-buyer-catcher-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  nc-buyer-catcher:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile main.py world_engine.py telegram_global_search.py north_cyprus_focus.py north_cyprus_hunter.py north_cyprus_recall.py north_cyprus_spam_guard.py north_cyprus_catcher.py north_cyprus_catcher_guarded.py

      - name: Run maximum-recall North Cyprus catcher
        timeout-minutes: 20
        env:
          WORLD_LOOKBACK_HOURS: ${{ github.event_name == 'workflow_dispatch' && '24' || (github.event.schedule == '52 6 * * *' && '24' || '4') }}
          WORLD_TELEGRAM_GLOBAL_QUERY_LIMIT: "16"
          WORLD_TELEGRAM_GLOBAL_RESULTS_PER_QUERY: "25"
          WORLD_TELEGRAM_DISCOVER_PUBLIC_GROUPS: ${{ github.event.schedule == '52 6 * * *' && '1' || '0' }}
          WORLD_TELEGRAM_PUBLIC_GROUP_LIMIT: "28"
          WORLD_TELEGRAM_PUBLIC_GROUP_MESSAGES: "70"
          NC_CATCHER_FORUM: ${{ github.event.schedule == '52 6 * * *' && '1' || '0' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: python north_cyprus_catcher_guarded.py

      - name: Notify catcher failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token=os.getenv('TELEGRAM_BOT_TOKEN','').strip()
          chat=os.getenv('TELEGRAM_CHAT_ID','').strip()
          if token and chat:
              requests.post(
                  f'https://api.telegram.org/bot{token}/sendMessage',
                  json={'chat_id':chat,'text':'⚠️ BAY-S NC BUYER CATCHER failed. Check GitHub Actions.'},
                  timeout=15,
              )
          PY
