name: Test Telegram Notification

on:
  workflow_dispatch:

jobs:
  telegram-test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -e
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "ERROR: TELEGRAM_BOT_TOKEN secret missing"; exit 1; fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then echo "ERROR: TELEGRAM_CHAT_ID secret missing"; exit 1; fi
          curl -fsS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"✅ BAY-S WORLD RADAR Telegram bağlantısı çalışıyor.\"}"