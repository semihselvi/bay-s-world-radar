name: BAY-S Radar Source Ranker

on:
  schedule:
    - cron: "17 5 * * 1"  # Monday 08:17 Turkey time
  workflow_dispatch:

jobs:
  rank-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py config.py source_ranker.py
      - name: Rank last 7 days
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python source_ranker.py
