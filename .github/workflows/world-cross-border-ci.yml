name: CI - WORLD West Europe Cross-Border Guard

on:
  push:
    paths:
      - "world_cross_border_guard.py"
      - "shard_runner.py"
      - "test_world_cross_border_guard.py"
      - ".github/workflows/world-cross-border-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile and run regressions
        run: |
          python -m py_compile main.py world_cross_border_guard.py test_world_cross_border_guard.py
          python -m unittest -q test_world_cross_border_guard.py
