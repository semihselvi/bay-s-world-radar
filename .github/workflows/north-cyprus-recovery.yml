name: BAY-S North Cyprus Recovery

on:
  workflow_dispatch:
    inputs:
      days:
        description: "7 or 30"
        required: false
        default: "7"
  schedule:
    # Turkey time UTC+3. Monday-Saturday: 7-day recovery. Sunday: 30-day recovery.
    - cron: "32 5 * * 1-6"   # 08:32 Turkey
    - cron: "32 13 * * 0"    # 16:32 Turkey Sunday

concurrency:
  group: bay-s-nc-recovery-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: |
          python -m py_compile main.py world_engine.py source_crawler_v2.py telegram_message_context.py telegram_global_search.py telegram_known_public_groups.py telegram_member_deep_search.py telegram_channel_comments.py telegram_network_crawler.py north_cyprus_source_performance.py north_cyprus_query_performance.py north_cyprus_author_reputation.py north_cyprus_notification_dedupe.py north_cyprus_cross_group.py north_cyprus_open_web.py north_cyprus_open_web_plus.py north_cyprus_conversation.py north_cyprus_focus.py north_cyprus_language_expansion.py north_cyprus_farsi_expansion.py north_cyprus_hunter.py north_cyprus_recall.py north_cyprus_spam_guard.py north_cyprus_intent_classifier.py north_cyprus_publisher_classifier.py north_cyprus_semantic_dedupe.py north_cyprus_intent_routing.py north_cyprus_catcher.py north_cyprus_reply_context.py north_cyprus_catcher_expanded.py north_cyprus_recovery.py runtime_quality_guard.py north_cyprus_recovery_quality.py test_runtime_quality_guard.py
          python test_runtime_quality_guard.py
      - name: Run recovery radar
        env:
          NC_RECOVERY_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.days || (github.event.schedule == '32 13 * * 0' && '30' || '7') }}
          WORLD_TELEGRAM_GLOBAL_QUERY_LIMIT: "12"
          WORLD_TELEGRAM_GLOBAL_RESULTS_PER_QUERY: "45"
          WORLD_TELEGRAM_DISCOVER_PUBLIC_GROUPS: "0"
          WORLD_TELEGRAM_KNOWN_GROUP_LIMIT: "40"
          WORLD_TELEGRAM_DYNAMIC_GROUP_LIMIT: "100"
          WORLD_TELEGRAM_KNOWN_GROUP_MESSAGES: "180"
          WORLD_TELEGRAM_DEEP_MAX_DIALOGS: "40"
          WORLD_TELEGRAM_DEEP_QUERY_LIMIT: "10"
          WORLD_TELEGRAM_DEEP_RESULTS: "30"
          WORLD_TELEGRAM_COMMENT_CHANNEL_LIMIT: "20"
          WORLD_TELEGRAM_COMMENT_MESSAGES: "120"
          WORLD_TELEGRAM_NETWORK_CRAWL: "0"
          NC_SOURCE_LEARNING: "0"
          NC_QUERY_LEARNING: "0"
          NC_SAME_TEXT_DEDUPE_HOURS: "168"
          NC_PERSON_DEDUPE_HOURS: "720"
          NC_OPEN_WEB_ENABLED: "0"
          NC_CATCHER_FORUM: ${{ github.event.schedule == '32 13 * * 0' && '1' || '0' }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          WORLD_TELEGRAM_MEMBER_CHATS: ${{ secrets.WORLD_TELEGRAM_MEMBER_CHATS }}
        run: python north_cyprus_recovery_quality.py
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token=os.getenv('TELEGRAM_BOT_TOKEN','').strip(); chat=os.getenv('TELEGRAM_CHAT_ID','').strip()
          if token and chat:
              run=f"https://github.com/{os.getenv('GITHUB_REPOSITORY','')}/actions/runs/{os.getenv('GITHUB_RUN_ID','')}"
              requests.post(f'https://api.telegram.org/bot{token}/sendMessage',json={'chat_id':chat,'text':f'⚠️ BAY-S NC RECOVERY failed. Other radar lanes continue.\n{run}'},timeout=15)
          PY
