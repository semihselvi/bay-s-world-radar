name: BAY-S North Cyprus Source Scout

on:
  workflow_dispatch:
  schedule:
    # Sunday 08:20 Turkey time (UTC+3). One Exa discovery call per week.
    - cron: "20 5 * * 0"

concurrency:
  group: bay-s-north-cyprus-source-scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py config.py world_engine.py source_scout.py
      - name: Preflight
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: |
          python - <<'PY'
          import os, sys
          required=["FIREBASE_SERVICE_ACCOUNT_JSON","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","EXA_API_KEY"]
          missing=[x for x in required if not os.getenv(x,"").strip()]
          print("SOURCE_SCOUT_PREFLIGHT", {x:("OK" if x not in missing else "MISSING") for x in required})
          if missing:
              sys.exit(2)
          PY
      - name: Discover new North Cyprus communities
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          WORLD_EXA_NUM_RESULTS: "15"
        run: python source_scout.py
