name: Grand Sapphire Telegram Sale Scan

on:
  workflow_dispatch:
  push:
    paths:
      - "grand_sapphire_sale_scan.py"
      - ".github/workflows/grand-sapphire-sale-scan.yml"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run focused scan
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          GRAND_SAPPHIRE_DAYS: "30"
        run: python grand_sapphire_sale_scan.py
