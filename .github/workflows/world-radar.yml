name: BAY-S World Radar

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC = 09:00 Turkey time (UTC+3)
    - cron: "0 6 * * *"

jobs:
  world-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile main.py config.py world_engine.py hybrid_engine.py telegram_member_reader.py telegram_hybrid_engine.py source_registry.py world_hard_filters.py

      - name: Run BAY-S World Radar
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          WORLD_LOOKBACK_HOURS: "24"
          WORLD_EXA_NUM_RESULTS: "15"
          WORLD_EXA_FALLBACK_CALLS: "2"
          WORLD_TELEGRAM_CHANNELS: ${{ secrets.WORLD_TELEGRAM_CHANNELS }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          WORLD_TELEGRAM_MEMBER_CHATS: ${{ secrets.WORLD_TELEGRAM_MEMBER_CHATS }}
          WORLD_TELEGRAM_MEMBER_MAX_DIALOGS: "120"
          WORLD_TELEGRAM_MEMBER_MAX_MESSAGES: "40"
        run: |
          python telegram_hybrid_engine.py
