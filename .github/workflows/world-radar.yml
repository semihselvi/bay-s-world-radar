name: BAY-S World Radar

on:
  workflow_dispatch:
  schedule:
    # 06:00 UTC = 09:00 Turkey time (UTC+3)
    - cron: "0 6 * * *"

jobs:
  world-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile main.py config.py fresh_runner.py

      - name: Run BAY-S World Radar
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          WORLD_LOOKBACK_HOURS: "24"
          WORLD_EXA_MAX_CALLS: "6"
          WORLD_EXA_NUM_RESULTS: "15"
        run: |
          python fresh_runner.py
