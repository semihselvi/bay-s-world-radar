name: BAY-S World Radar

on:
  workflow_dispatch:
  schedule:
    # 06:07 UTC = 09:07 Turkey time (UTC+3)
    - cron: "7 6 * * *"

jobs:
  world-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m py_compile main.py config.py world_engine.py hybrid_engine.py telegram_member_reader.py telegram_hybrid_engine.py source_registry.py world_hard_filters.py

      - name: Preflight required secrets
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          python - <<'PY'
          import os, sys
          required = [
              "EXA_API_KEY",
              "FIREBASE_SERVICE_ACCOUNT_JSON",
              "TELEGRAM_BOT_TOKEN",
              "TELEGRAM_CHAT_ID",
              "TELEGRAM_API_ID",
              "TELEGRAM_API_HASH",
              "TELEGRAM_STRING_SESSION",
          ]
          missing = [name for name in required if not os.getenv(name, "").strip()]
          print("SECRET_PREFLIGHT")
          for name in required:
              print(f"  {name}: {'OK' if name not in missing else 'MISSING'}")
          if missing:
              print("MISSING_SECRETS=" + ",".join(missing))
              print("Radar stopped BEFORE Exa calls, so no paid scan was used.")
              sys.exit(2)
          print("SECRET_PREFLIGHT_OK")
          PY

      - name: Run BAY-S World Radar
        timeout-minutes: 18
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          WORLD_LOOKBACK_HOURS: "24"
          WORLD_EXA_NUM_RESULTS: "15"
          WORLD_EXA_FALLBACK_CALLS: "2"
          WORLD_TELEGRAM_CHANNELS: ${{ secrets.WORLD_TELEGRAM_CHANNELS }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          WORLD_TELEGRAM_MEMBER_CHATS: ${{ secrets.WORLD_TELEGRAM_MEMBER_CHATS }}
          WORLD_TELEGRAM_MEMBER_MAX_DIALOGS: "60"
          WORLD_TELEGRAM_MEMBER_MAX_MESSAGES: "25"
        run: |
          python telegram_hybrid_engine.py

      - name: Notify Telegram on radar failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os, requests
          token = os.getenv("TELEGRAM_BOT_TOKEN", "").strip()
          chat_id = os.getenv("TELEGRAM_CHAT_ID", "").strip()
          if token and chat_id:
              text = "⚠️ BAY-S WORLD RADAR çalışırken hata oluştu. GitHub Actions logunu kontrol edin."
              r = requests.post(f"https://api.telegram.org/bot{token}/sendMessage", json={"chat_id": chat_id, "text": text}, timeout=15)
              print("FAILURE_TELEGRAM_STATUS", r.status_code)
          else:
              print("FAILURE_TELEGRAM_DISABLED missing token/chat id")
          PY
