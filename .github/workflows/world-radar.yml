name: BAY-S World Radar

on:
  workflow_dispatch:
  schedule:
    # Turkey time UTC+3
    - cron: "7 6 * * *"        # 09:07 full morning scan
    - cron: "37 6 * * *"       # 09:37 North Cyprus hunter + 1 Exa
    - cron: "37 9,12,15,18 * * *" # 12:37/15:37/18:37/21:37 North Cyprus free pulses
    - cron: "7 12 * * *"       # 15:07 Telegram member refresh, no Exa
    - cron: "7 18 * * *"       # 21:07 Telegram + Golden/South refresh, 1 Exa

concurrency:
  group: bay-s-world-radar-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  morning-shards:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 6 * * *'
    strategy:
      fail-fast: false
      matrix:
        shard: [north_cyprus_cis, golden_south, west_europe, central_europe, telegram_member]
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax check
        run: python -m py_compile main.py config.py world_engine.py hybrid_engine.py telegram_member_reader.py source_registry.py source_crawler_v2.py shard_runner.py north_cyprus_focus.py north_cyprus_hunter.py world_hard_filters.py
      - name: Preflight required secrets
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
        run: |
          python - <<'PY'
          import os, sys
          required = ["FIREBASE_SERVICE_ACCOUNT_JSON","TELEGRAM_BOT_TOKEN","TELEGRAM_CHAT_ID","EXA_API_KEY","TELEGRAM_API_ID","TELEGRAM_API_HASH","TELEGRAM_STRING_SESSION"]
          missing=[x for x in required if not os.getenv(x,"").strip()]
          print("SECRET_PREFLIGHT", {x:("OK" if x not in missing else "MISSING") for x in required})
          if missing:
              print("MISSING_SECRETS="+",".join(missing)); sys.exit(2)
          PY
      - name: Run morning shard ${{ matrix.shard }}
        timeout-minutes: 17
        env:
          WORLD_RADAR_SHARD: ${{ matrix.shard }}
          WORLD_LOOKBACK_HOURS: "24"
          WORLD_EXA_NUM_RESULTS: "15"
          WORLD_DIRECT_LINK_LIMIT: "16"
          WORLD_CATALOG_CHANNEL_LIMIT: "10"
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          WORLD_TELEGRAM_MEMBER_CHATS: ${{ secrets.WORLD_TELEGRAM_MEMBER_CHATS }}
          WORLD_TELEGRAM_MEMBER_MAX_DIALOGS: "100"
          WORLD_TELEGRAM_MEMBER_MAX_MESSAGES: "40"
        run: python shard_runner.py
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,requests
          t=os.getenv('TELEGRAM_BOT_TOKEN',''); c=os.getenv('TELEGRAM_CHAT_ID','')
          if t and c: requests.post(f'https://api.telegram.org/bot{t}/sendMessage',json={'chat_id':c,'text':'⚠️ BAY-S WORLD RADAR morning shard failed. Check GitHub Actions.'},timeout=15)
          PY

  north-cyprus-hunter:
    if: github.event.schedule == '37 6 * * *' || github.event.schedule == '37 9,12,15,18 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check North Cyprus hunter
        run: python -m py_compile main.py config.py world_engine.py hybrid_engine.py telegram_member_reader.py source_registry.py source_crawler_v2.py shard_runner.py north_cyprus_focus.py north_cyprus_hunter.py
      - name: Run North Cyprus hunter
        timeout-minutes: 20
        env:
          WORLD_RADAR_SHARD: north_cyprus_hunter
          WORLD_LOOKBACK_HOURS: ${{ github.event.schedule == '37 6 * * *' && '24' || '4' }}
          WORLD_SHARD_EXA_CALLS: ${{ github.event.schedule == '37 6 * * *' && '1' || '0' }}
          WORLD_EXA_NUM_RESULTS: "15"
          WORLD_DIRECT_LINK_LIMIT: "20"
          WORLD_CATALOG_CHANNEL_LIMIT: "15"
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          WORLD_TELEGRAM_MEMBER_CHATS: ${{ secrets.WORLD_TELEGRAM_MEMBER_CHATS }}
          WORLD_TELEGRAM_MEMBER_TITLE_KEYWORDS: "north cyprus,northern cyprus,kuzey kıbrıs,kuzey kibris,cyprus,kıbrıs,kibris,iskele,İskele,long beach,girne,kyrenia,esentepe,famagusta,gazimağusa,gazimagusa,lapta,tatlısu,tatlisu,bafra"
          WORLD_TELEGRAM_MEMBER_MAX_DIALOGS: "160"
          WORLD_TELEGRAM_MEMBER_MAX_MESSAGES: "80"
        run: python north_cyprus_hunter.py
      - name: Notify North Cyprus hunter failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os,requests
          t=os.getenv('TELEGRAM_BOT_TOKEN',''); c=os.getenv('TELEGRAM_CHAT_ID','')
          if t and c: requests.post(f'https://api.telegram.org/bot{t}/sendMessage',json={'chat_id':c,'text':'⚠️ BAY-S NORTH CYPRUS HUNTER failed. Check GitHub Actions.'},timeout=15)
          PY

  afternoon-telegram:
    if: github.event.schedule == '7 12 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run Telegram refresh
        env:
          WORLD_RADAR_SHARD: telegram_member
          WORLD_LOOKBACK_HOURS: "8"
          WORLD_SHARD_EXA_CALLS: "0"
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          WORLD_TELEGRAM_MEMBER_CHATS: ${{ secrets.WORLD_TELEGRAM_MEMBER_CHATS }}
          WORLD_TELEGRAM_MEMBER_MAX_DIALOGS: "80"
          WORLD_TELEGRAM_MEMBER_MAX_MESSAGES: "30"
        run: python shard_runner.py

  evening-shards:
    if: github.event.schedule == '7 18 * * *'
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: telegram_member
            lookback: "8"
            exa: "0"
          - shard: golden_south
            lookback: "12"
            exa: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run evening shard ${{ matrix.shard }}
        env:
          WORLD_RADAR_SHARD: ${{ matrix.shard }}
          WORLD_LOOKBACK_HOURS: ${{ matrix.lookback }}
          WORLD_SHARD_EXA_CALLS: ${{ matrix.exa }}
          WORLD_EXA_NUM_RESULTS: "15"
          WORLD_DIRECT_LINK_LIMIT: "16"
          WORLD_CATALOG_CHANNEL_LIMIT: "10"
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION }}
          WORLD_TELEGRAM_MEMBER_CHATS: ${{ secrets.WORLD_TELEGRAM_MEMBER_CHATS }}
          WORLD_TELEGRAM_MEMBER_MAX_DIALOGS: "80"
          WORLD_TELEGRAM_MEMBER_MAX_MESSAGES: "30"
        run: python shard_runner.py
