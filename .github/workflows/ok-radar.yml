name: OK.RU RADAR

on:
  workflow_dispatch:
  push:
    paths:
      - ok_radar.py
      - russian_social_review.py
      - .github/workflows/ok-radar.yml
  schedule:
    - cron: "29 5,9,13,17,21 * * *"

concurrency:
  group: ok-ru-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: OK.ru buyer scan
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m py_compile ok_radar.py
          python ok_radar.py
