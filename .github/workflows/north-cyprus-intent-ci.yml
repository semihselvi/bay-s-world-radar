name: BAY-S NC Intent CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "north_cyprus_intent_classifier.py"
      - "north_cyprus_publisher_classifier.py"
      - "north_cyprus_semantic_dedupe.py"
      - "north_cyprus_intent_routing.py"
      - "north_cyprus_notification_dedupe.py"
      - "north_cyprus_catcher_expanded.py"
      - "north_cyprus_recovery.py"
      - "north_cyprus_intent_selftest.py"
      - "runtime_quality_guard.py"
      - "north_cyprus_catcher_quality.py"
      - "north_cyprus_recovery_quality.py"
      - "test_runtime_quality_guard.py"
      - ".github/workflows/north-cyprus-intent-ci.yml"

permissions:
  contents: read

concurrency:
  group: bay-s-nc-intent-ci
  cancel-in-progress: true

jobs:
  intent-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Syntax check intent stack
        run: |
          python -m py_compile north_cyprus_intent_classifier.py north_cyprus_publisher_classifier.py north_cyprus_semantic_dedupe.py north_cyprus_intent_selftest.py runtime_quality_guard.py north_cyprus_catcher_quality.py north_cyprus_recovery_quality.py test_runtime_quality_guard.py
      - name: Intent regression self-test
        run: |
          python north_cyprus_intent_selftest.py
          python test_runtime_quality_guard.py
