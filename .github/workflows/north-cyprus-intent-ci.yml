name: ARCHIVE - BAY-S NC Intent CI

"on":
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: bay-s-nc-intent-ci
  cancel-in-progress: true

jobs:
  intent-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Syntax check intent stack
        run: |
          python -m py_compile north_cyprus_intent_classifier.py north_cyprus_publisher_classifier.py north_cyprus_semantic_dedupe.py north_cyprus_intent_selftest.py runtime_quality_guard.py runtime_quality_guard_batch.py north_cyprus_catcher_quality.py north_cyprus_recovery_quality.py test_runtime_quality_guard.py test_runtime_quality_guard_batch.py
      - name: Intent regression self-test
        run: |
          python north_cyprus_intent_selftest.py
          python test_runtime_quality_guard.py
          python test_runtime_quality_guard_batch.py
